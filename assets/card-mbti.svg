<svg xmlns="http://www.w3.org/2000/svg" width="590" height="260" viewBox="0 0 590 260">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#ff7a90"/><stop offset="1" stop-color="#ff7a90" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#ff7a90" stop-opacity=".16"/><stop offset="1" stop-color="#ff7a90" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="590" height="260" rx="16"/></clipPath>
</defs>
<style>
.mono{font-family:Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.ln{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}

.trace{stroke-dasharray:140 1560;animation:trace 6s linear infinite} @keyframes trace{to{stroke-dashoffset:-1700}}
</style>
<g clip-path="url(#r)">
  <rect width="590" height="260" fill="#0d121b"/>
  <rect width="590" height="260" fill="url(#glow)"/>
  <rect width="590" height="3" fill="url(#bar)"/>
  <text x="28" y="40" class="mono" font-size="12" fill="#7d8ba1">model_05 · nlp</text>
  <text x="562" y="40" class="mono" font-size="12" fill="#ff7a90" text-anchor="end">view code →</text>
  <text x="28" y="82" class="sans" font-size="27" font-weight="700" fill="#eef3fa">MBTI Personality Prediction</text>
  <text x="28" y="114" class="sans" font-size="16" font-style="italic" fill="#ff7a90">“Tell me how you write — I&#x27;ll tell you who you are.”</text>
  <text x="28" y="150" class="sans" font-size="15" fill="#cfd8e6">NLP model that reads your text and predicts</text>
  <text x="28" y="172" class="sans" font-size="15" fill="#cfd8e6">one of the 16 MBTI personality types.</text>
  <rect x="28" y="198" width="47" height="26" rx="13" fill="#ff7a90" fill-opacity=".1" stroke="#ff7a90" stroke-opacity=".45"/><text x="51" y="215" class="mono" font-size="12" fill="#ff7a90" text-anchor="middle">NLP</text><rect x="82.8" y="198" width="115" height="26" rx="13" fill="#ff7a90" fill-opacity=".1" stroke="#ff7a90" stroke-opacity=".45"/><text x="140" y="215" class="mono" font-size="12" fill="#ff7a90" text-anchor="middle">scikit-learn</text><rect x="206.0" y="198" width="62" height="26" rx="13" fill="#ff7a90" fill-opacity=".1" stroke="#ff7a90" stroke-opacity=".45"/><text x="237" y="215" class="mono" font-size="12" fill="#ff7a90" text-anchor="middle">Flask</text>
</g>
<rect x=".5" y=".5" width="589" height="259" rx="16" fill="none" stroke="#1f2a3a"/>
<rect class="trace" x=".5" y=".5" width="589" height="259" rx="16" fill="none" stroke="#ff7a90" stroke-width="1.6" stroke-opacity=".9"/>
</svg>