<svg xmlns="http://www.w3.org/2000/svg" width="290" height="72" viewBox="0 0 290 72">
<defs><clipPath id="clip"><rect width="290" height="72" rx="14"/></clipPath><radialGradient id="bg" cx="0%" cy="50%" r="80%"><stop offset="0" stop-color="#3ef0a8" stop-opacity=".12"/><stop offset="1" stop-color="#3ef0a8" stop-opacity="0"/></radialGradient></defs>
<style>
.mono{font-family:Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.ln{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.glow{animation:glow 2.6s ease-in-out infinite} @keyframes glow{50%{opacity:.3}}
.pulse{stroke-dasharray:12 420;animation:flow 2.4s linear infinite} @keyframes flow{from{stroke-dashoffset:432}to{stroke-dashoffset:0}}
.trace{stroke-dasharray:70 654;animation:t 5s linear infinite} @keyframes t{to{stroke-dashoffset:-724}}</style>
<g clip-path="url(#clip)"><rect width="290" height="72" fill="#0d121b"/><rect width="290" height="72" fill="#0d121b"/>
<rect width="290" height="72" fill="url(#bg)"/>
<rect x="16" y="16" width="40" height="40" rx="10" fill="#3ef0a8" fill-opacity=".14" stroke="#3ef0a8" stroke-opacity=".5"/>
<circle cx="36" cy="36" r="10" fill="none" stroke="#3ef0a8" stroke-width="2"/><path d="M26 36h20M36 26c4 4 4 16 0 20M36 26c-4 4-4 16 0 20" fill="none" stroke="#3ef0a8" stroke-width="1.6"/>
<text x="72" y="33" class="sans" font-size="17" font-weight="700" fill="#eef3fa">Portfolio</text>
<text x="72" y="53" class="mono" font-size="12" fill="#3ef0a8">karankatore01.github.io</text>
<text x="268" y="42" class="sans" font-size="18" fill="#3ef0a8" text-anchor="end">↗</text></g>
<rect x=".5" y=".5" width="289" height="71" rx="14" fill="none" stroke="#1f2a3a"/>
<rect class="trace" x=".5" y=".5" width="289" height="71" rx="14" fill="none" stroke="#3ef0a8" stroke-width="1.6"/></svg>