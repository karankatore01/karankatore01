2="484" y2="114" stroke="#b18cff" stroke-width="1.6"/><line x1="484" y1="114" x2="471" y2="138" stroke="#b18cff" stroke-width="1.6"/><line x1="471" y1="138" x2="458" y2="114" stroke="#b18cff" stroke-width="1.6"/><circle class="glow" style="animation-delay:0.0s" cx="458" cy="114" r="5" fill="#b18cff"/><circle class="glow" style="animation-delay:0.6s" cx="484" cy="114" r="5" fill="#b18cff"/><circle class="glow" style="animation-delay:1.2s" cx="471" cy="138" r="5" fill="#b18cff"/><text x="444" y="184" class="mono" font-size="12" fill="#b18cff" letter-spacing="1.5">LLM AGENTS &amp; RAG</text><text x="444" y="214" class="sans" font-size="23" font-weight="700" fill="#eef3fa">Reason over knowledge</text><text x="444" y="240" class="sans" font-size="14" fill="#cfd8e6">Multi-agent workflows and RAG that</text><text x="444" y="260" class="sans" font-size="14" fill="#cfd8e6">answer from your own documents.</text><rect x="444" y="272" width="87" height="22" rx="11" fill="#b18cff" fill-opacity=".1" stroke="#b18cff" stroke-opacity=".4"/><text x="487" y="287" class="mono" font-size="11" fill="#b18cff" text-anchor="middle">LangChain</text><rect x="536.6" y="272" width="57" height="22" rx="11" fill="#b18cff" fill-opacity=".1" stroke="#b18cff" stroke-opacity=".4"/><text x="565" y="287" class="mono" font-size="11" fill="#b18cff" text-anchor="middle">FAISS</text><rect x="599.6" y="272" width="50" height="22" rx="11" fill="#b18cff" fill-opacity=".1" stroke="#b18cff" stroke-opacity=".4"/><text x="624" y="287" class="mono" font-size="11" fill="#b18cff" text-anchor="middle">LLMs</text><rect x="800" y="72" width="360" height="230" rx="14" fill="#0d121b" stroke="#1f2a3a"/><rect x="800" y="72" width="360" height="3" fill="url(#bar2)"/><rect x="824" y="98" width="54" height="54" rx="12" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".45"/><rect class="grow" style="animation-delay:0.0s" x="834" y="128" width="6" height="14" rx="1.5" fill="#ffb86b"/><rect class="grow" style="animation-delay:0.25s" x="843" y="118" width="6" height="24" rx="1.5" fill="#ffb86b"/><rect class="grow" style="animation-delay:0.5s" x="852" y="124" width="6" height="18" rx="1.5" fill="#ffb86b"/><rect class="grow" style="animation-delay:0.75s" x="861" y="110" width="6" height="32" rx="1.5" fill="#ffb86b"/><text x="824" y="184" class="mono" font-size="12" fill="#ffb86b" letter-spacing="1.5">DATA SCIENCE &amp; PIPELINES</text><text x="824" y="214" class="sans" font-size="23" font-weight="700" fill="#eef3fa">Turn data into decisions</text><text x="824" y="240" class="sans" font-size="14" fill="#cfd8e6">Modelling, analytics and the data</text><text x="824" y="260" class="sans" font-size="14" fill="#cfd8e6">pipelines that feed every model.</text><rect x="824" y="272" width="64" height="22" rx="11" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".4"/><text x="856" y="287" class="mono" font-size="11" fill="#ffb86b" text-anchor="middle">Pandas</text><rect x="894.4" y="272" width="42" height="22" rx="11" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".4"/><text x="916" y="287" class="mono" font-size="11" fill="#ffb86b" text-anchor="middle">SQL</text><rect x="942.6" y="272" width="109" height="22" rx="11" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".4"/><text x="997" y="287" class="mono" font-size="11" fill="#ffb86b" text-anchor="middle">scikit-learn</text></g>
