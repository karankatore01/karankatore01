<svg xmlns="http://www.w3.org/2000/svg" width="590" height="260" viewBox="0 0 590 260">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#5ab4ff"/><stop offset="1" stop-color="#5ab4ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#5ab4ff" stop-opacity=".16"/><stop offset="1" stop-color="#5ab4ff" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="590" height="260" rx="16"/></clipPath>
</defs>
<style>
.mono{font-family:Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.ln{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}

.trace{stroke-dasharray:140 1560;animation:trace 6s linear infinite} @keyframes trace{to{stroke-dashoffset:-1700}}
</style>
<g clip-path="url(#r)">
  <rect width="590" height="260" fill="#0d121b"/>
  <rect width="590" height="260" fill="url(#glow)"/>
  <rect width="590" height="3" fill="url(#bar)"/>
  <text x="28" y="40" class="mono" font-size="12" fill="#7d8ba1">model_02 · vision</text>
  <text x="562" y="40" class="mono" font-size="12" fill="#5ab4ff" text-anchor="end">view code →</text>
  <text x="28" y="82" class="sans" font-size="27" font-weight="700" fill="#eef3fa">Global Identity Matching</text>
  <text x="28" y="114" class="sans" font-size="16" font-style="italic" fill="#5ab4ff">“Is this the same person I saw on camera 3?”</text>
  <text x="28" y="150" class="sans" font-size="15" fill="#cfd8e6">FastReID embeddings + similarity search keep one</text>
  <text x="28" y="172" class="sans" font-size="15" fill="#cfd8e6">shared registry of identities across cameras.</text>
  <rect x="28" y="198" width="85" height="26" rx="13" fill="#5ab4ff" fill-opacity=".1" stroke="#5ab4ff" stroke-opacity=".45"/><text x="70" y="215" class="mono" font-size="12" fill="#5ab4ff" text-anchor="middle">FastReID</text><rect x="120.8" y="198" width="77" height="26" rx="13" fill="#5ab4ff" fill-opacity=".1" stroke="#5ab4ff" stroke-opacity=".45"/><text x="159" y="215" class="mono" font-size="12" fill="#5ab4ff" text-anchor="middle">PyTorch</text><rect x="206.0" y="198" width="153" height="26" rx="13" fill="#5ab4ff" fill-opacity=".1" stroke="#5ab4ff" stroke-opacity=".45"/><text x="283" y="215" class="mono" font-size="12" fill="#5ab4ff" text-anchor="middle">similarity search</text>
</g>
<rect x=".5" y=".5" width="589" height="259" rx="16" fill="none" stroke="#1f2a3a"/>
<rect class="trace" x=".5" y=".5" width="589" height="259" rx="16" fill="none" stroke="#5ab4ff" stroke-width="1.6" stroke-opacity=".9"/>
</svg>