<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<defs><clipPath id="clip"><rect width="1200" height="330" rx="18"/></clipPath><linearGradient id="bar0" x1="0" x2="1"><stop offset="0" stop-color="#3ef0a8"/><stop offset="1" stop-color="#3ef0a8" stop-opacity="0"/></linearGradient><linearGradient id="bar1" x1="0" x2="1"><stop offset="0" stop-color="#b18cff"/><stop offset="1" stop-color="#b18cff" stop-opacity="0"/></linearGradient><linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#ffb86b"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/></linearGradient></defs>
<style>
.mono{font-family:Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.ln{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.glow{animation:glow 2.6s ease-in-out infinite} @keyframes glow{50%{opacity:.3}}
.pulse{stroke-dasharray:12 420;animation:flow 2.4s linear infinite} @keyframes flow{from{stroke-dashoffset:432}to{stroke-dashoffset:0}}

.eye{animation:look 4s ease-in-out infinite} @keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 2s ease-in-out infinite alternate} @keyframes grow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
</style>
